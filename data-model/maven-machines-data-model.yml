note: >-
  Maven publishes no consolidated object reference page, so this graph is derived from the specs'
  component schemas and id-reference fields rather than from a documented ERD. The Reddy Ice and
  Bozzuto's middleware documents contribute customer-specific entities (ReddyIceCaseDto,
  ProductEligibilityItemDto, OrderSnapshotRequestDto, CutoffItemDto) that are NOT part of the
  general platform model.
