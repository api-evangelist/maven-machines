openapi: 3.2.0
info:
  title: Averitt Bulk Shipments API
  description: Documentation for Averitt
  version: '1.0'
  contact: {}
servers:
- url: https://integrations.mavenmachines.com
tags:
- name: bulk-shipments
paths:
  /bulkShipments:
    post:
      operationId: BulkShipmentsController_handleBulkShipments
      summary: POST /bulkShipments
      description: API to send bulk shipment data
      parameters: []
      responses:
        '200':
          description: A successful API response for bulk shipments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialsResponseDto'
      tags:
      - bulk-shipments
      security:
      - api_key: []
components:
  schemas:
    CredentialsResponseDto:
      type: object
      properties: {}
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: apiKey
