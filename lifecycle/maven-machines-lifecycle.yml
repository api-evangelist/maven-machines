sla:
  published: false
  detail: >-
    Maven states that "the production environment ... is under the governance of Maven's
    production SLAs for uptime, performance, and monitoring" but does not publish the SLA terms,
    numbers, or credits publicly. Staging carries no SLA.
  source: https://maven-machines.readme.io/docs/basic-concepts
data_retention:
