changelog:
  published: false
  detail: >-
    No changelog surface. https://maven-machines.readme.io/changelog returns 404, and the developer
    hub exposes no releases or release-notes section. Individual doc pages carry an `updatedAt`
    timestamp in their markdown frontmatter (ranging 2025-01-28 to 2026-02-09), which is the only
    dated change signal available.
