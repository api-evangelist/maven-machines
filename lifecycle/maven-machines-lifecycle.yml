versioning:
  scheme: none-in-path
  detail: >-
    No version segment appears in any path and no version header is documented. Endpoints are
    served flat off the base URL (POST https://integrations.mavenmachines.com/users). The
    `info.version` field in the published specs is "1.0" or "1.0.0" and is not surfaced to callers.
  breaking_change_policy: >-
    Not published. Maven does document that a feature-flag and staged-deployment system means
    "customers testing new or beta functionality may notice differences in API request and response
    schemas and feature behavior between staging and production" — i.e. schema drift between
    environments is expected and managed per fleet.
  source: https://maven-machines.readme.io/docs/basic-concepts
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  deprecated_operations: 0
  detail: >-
    No deprecation policy, no RFC 8594 Sunset/Deprecation headers, and no operation in any of the
    21 published specs carries `deprecated: true`. Nothing in the developer hub describes how or
    when an endpoint is retired.
