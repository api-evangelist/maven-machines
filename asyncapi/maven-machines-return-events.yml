asyncapi_published: false
webhooks_published: false
delivery: pull
note: >-
  Maven has a substantial, fully catalogued event surface — but it is NOT a webhook surface and
  there is NO AsyncAPI document. Events are consumed by POLLING `GET /return-events`; Maven
  publishes no callback registration, no delivery retry policy, no signing secret, and no
  `callbacks`/`webhooks` block in any of the 21 OpenAPI documents. For that reason NO `Webhooks`
  and NO `AsyncAPI` pointer is emitted in apis.yml — an honest absence, recorded rather than
  papered over. The catalog below is what Maven actually documents.
transport:
  operation: GET /return-events
  operationId: get-return-events
  alias: GET /events (operationId get-events, planning-and-dispatch definition)
  style: polled queue, ordered by generation time
  cursor: startTime (ISO 8601 UTC)
  recommended_interval: every 30 seconds to 1 minute
  retention: >-
    30 days — "Each event in the Maven system is stored for 30 days from the date of creation.
    After 30 days, the event is deleted from the system and can no longer be read."
  envelope:
    id: Unique event identifier.
    timestamp: UTC ISO 8601, when the return event was produced.
    eventType: Describes the format of the return event data.
    data: The event payload.
