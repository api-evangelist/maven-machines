gaps:
- No AsyncAPI or CloudEvents description of any of these 49 event types.
- No push delivery — every consumer must run a polling loop and manage its own cursor.
- >-
  No dead-letter or replay beyond the 30-day window; a consumer that is down for a month loses the
  events permanently.
