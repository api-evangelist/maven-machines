tenancy:
  model: key-scoped
  detail: >-
    The key binds a caller to one company. A 401 in the users specification is described as "This
    endpoint may only be executed for company 1". The planning-and-dispatch definition additionally
    templates the tenant into the server URL —
    https://integrations.mavenmachines.com/companies/{companyKey}/ — so a caller integrating
    against that definition supplies the company twice, once in the path and once implicitly
    through the key.
environments:
- name: production
  base_url: https://integrations.mavenmachines.com/
- name: staging
  base_url: https://integrations-staging.mavenmachines.com/
  note: Keys are not interchangeable between environments.
key_management:
  self_serve: false
  rotation_documented: false
  scopes: false
  expiry_documented: false
  detail: >-
    Maven publishes no key-issuance, rotation, expiry or revocation procedure, no scope or
    permission model on the key, and no self-serve developer signup. Keys are provisioned to
    contracted fleets. Driver-facing permissions (e.g. "Market App Access") are managed in the Maven
    Fleet Admin portal as user roles, not as API scopes.
public_endpoints:
- path: GET /
  service: reddy-ice middleware
  detail: '"GET / is public and does not require an API key." Health check only; returns "Hello World!".'
gaps:
- >-
  All 17 OpenAPI 3.0.0 documents DECLARE the apiKey scheme in components.securitySchemes but do NOT
  apply it at document level (`security` is null). Only the four 3.1.0 documents carry a top-level
  security requirement. A client generated from the 3.0.0 documents authenticates nothing by
  default — see overlays/ for the correction.
- No OAuth, OIDC or mTLS option for enterprise fleets; a single long-lived shared header key is the
  only credential.
- /.well-known/openid-configuration and /.well-known/oauth-authorization-server return 404 on every
  Maven host, including accounts.mavenmachines.com.
