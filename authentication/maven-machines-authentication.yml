schemes:
- name: api_key
  type: apiKey
  in: header
  parameter: apiKey
  description: >-
    A single per-fleet, per-environment key sent as the `apiKey` request header on every protected
    call. Maven states it plainly in the middleware documentation: "All protected endpoints require
    an API key in the `apiKey` request header", and "Your `apiKey` determines which Maven
    environment (dev, qa, staging, prod) receives the request." The truckload documentation adds
    that "the apiKey header authenticates and authorizes the request to submit trip data for a
    specific company" — so the key is the tenant selector as well as the credential.
