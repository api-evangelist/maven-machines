    any machine-readable artifact. Recorded as an observed signature, not as certified conformance.
  note: >-
    REWARD-ONLY check: the duty-status vocabulary is real evidence of the domain standard inside
    the contract. Registration on the FMCSA ELD list is a separate fact this pipeline did not
