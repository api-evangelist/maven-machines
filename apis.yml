apis:
- aid: maven-machines-integrations-api
  name: Maven Integrations API
  description: >-
    Maven's public REST API for integrating a fleet's TMS and other IT systems with the Maven
    platform. Fifteen published OpenAPI definitions cover users, vehicles and trailers, company
    locations, customers, shipments and shipment locations, P&D manifests, linehaul manifests and
    trips, truckload trips and stops, forms and form results, messages, market app sessions, ELD /
    hours-of-service, vehicle telematics locations, Smart (manufacturing) alarm and batch logs,
    reports, and the polled return-events queue. Every call is authenticated with an `apiKey`
    request header; production and staging environments are separate and do not share data.
  humanURL: https://maven-machines.readme.io/
  baseURL: https://integrations.mavenmachines.com
  tags:
  - Transportation
  - Logistics
  - Fleet Management
  - ELD
