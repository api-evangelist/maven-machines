- aid: maven-machines-customer-middleware
  name: Maven Customer Integration Middleware
  description: >-
    Per-customer middleware services Maven operates on <customer>.middleware.mavenmachines.com that
    translate a specific shipper or carrier's message formats into Maven platform calls. Six of
    these services publish a Swagger/OpenAPI document publicly — AAA Cooper, Averitt, Bozzuto's,
    Reddy Ice, Roy Miller and Triple S Steel — covering shipment, bulk shipment, manifest, manifest
    command, order snapshot/cutoff, route plan, case and service-tech asset endpoints. All are
    authenticated with the same `apiKey` header as the platform API.
  humanURL: https://maven-machines.readme.io/docs/maven-bozzutos-integration
  baseURL: https://integrations.mavenmachines.com
