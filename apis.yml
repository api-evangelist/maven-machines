aid: maven-machines
name: Maven Machines
description: >-
  Maven Machines (branded "Maven") is a Pittsburgh, Pennsylvania software company that builds a
  cloud platform for automating the planning and execution of daily trucking operations. The
  product suite spans route planning and optimization, dispatch execution, driver workflow, ELD /
  hours-of-service compliance, telematics and fleet management, delivered through a web portal for
  planners and dispatchers and an Android driver application. Maven publishes a public developer
  hub at maven-machines.readme.io covering fifteen separate OpenAPI definitions against a single
  production base URL, https://integrations.mavenmachines.com, secured with an `apiKey` request
  header. The integration model is TMS-to-Maven — master data (users, vehicles, trailers, company
  locations), transactional data (shipments, P&D manifests, linehaul manifests and trips, truckload
  trips and stops) flows in, and business activity flows back out through a polled
  `GET /return-events` queue and an event-sourced manifest/movement commands API. Maven also
  operates per-customer integration middleware services on <customer>.middleware.mavenmachines.com,
  several of which publish their own Swagger/OpenAPI documents publicly.
